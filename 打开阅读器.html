const library=[{"id":"反脆弱/ch01/001_伴读与译文.md","book":"反脆弱","chapterId":"ch01","chapterNumber":1,"chapterTitle":"第 1 章","title":"第 1 章　在达摩克利斯与九头蛇之间","variant":"伴读与译文","preferred":false,"content":"# 第 1 章　在达摩克利斯与九头蛇之间\n\n- 英文依据：*Antifragile: Things That Gain from Disorder*\n- 来源范围：英文 PDF 物理页 47–59，单元 `ch01`，offset `0–21057`\n- 中文参考：EPUB `Fan_Cui_Ruo_split_009.html#p0001–p0046`\n- 完整性：覆盖章题、引题、五个小节、图 1 说明和两条脚注\n- 呈现方式：伴读与自然译文合并；逐句核对英文，关键难句另附直译对照\n- 阅读状态：译文已生成，尚未确认用户读完\n\n> 想先读更自然、更直白的版本，可打开：[002 · 中文语境易读版](002_中文语境易读版.md)。本文件保留较贴近英文结构的译文，适合回查原意。\n\n> 本章涉及毒物兴奋效应、热量限制、抗生素和财政政策。下面忠实呈现作者的说法；这些内容是本书论证的一部分，不等于已经核实的医疗或政策建议。\n\n## 读前引导\n\n先抓住两个区别：\n\n1. **没有坏掉，不等于变得更好。** 达摩克利斯会因冲击受损，凤凰受损后恢复原状，九头蛇受损后反而增益。\n2. **“从冲击中获益”必须带有限定。** 对什么冲击、在多大剂量下、以什么指标衡量、由谁获益？作者在本章先提出概念，后面的章节才会逐步补充边界。\n\n带着一个问题往下读：如果一个系统经历冲击后恢复原状，它与经历冲击后获得了新能力，差别究竟在哪里？\n\n---\n\n## 完整顺译\n\n### 章题与引题\n\n**第 1 章　在达摩克利斯与九头蛇之间**\n\n请砍下我的头——颜色如何施展某种魔法，从眼中之色变成口中之名——如何在迪拜举重\n\n### 生活有一半尚未命名\n\n你正在邮局，准备把一份礼物寄给远在中西伯利亚的表亲。包裹里装满了香槟杯，运输途中可能受损，因此你会用红字在外面盖上“易碎”“当心破损”或者“小心轻放”。那么，与这种状态完全相反的情形是什么？“易碎”的确切反义词究竟是什么？\n\n几乎所有人都会回答“坚固”“有韧性”“结实”，或者诸如此类的词。但有韧性、坚固的东西既不会破损，也不会因为颠簸而变得更好，所以包裹上根本不需要写什么——你见过哪个包裹盖着醒目的绿色大字“本品坚固”吗？按照逻辑，与“易碎”包裹完全相反的包裹，应该写着“请粗暴搬运”或者“请随意乱放”。里面的东西不只摔不坏，还会从碰撞和各种折腾中受益。\n\n易碎物品所能得到的最好结果，是没有受损；坚固物品无论最好还是最坏，也只是没有受损。因此，易碎事物真正的反面，应该是某种东西：即使在最坏的情况下也不会受损，而一旦情况稍好，它还可能有所增益。\n\n我们把这种包裹称为“反脆弱的”。之所以必须造一个新词，是因为《牛津英语词典》里没有一个简洁的非复合词，能够准确表达“脆弱性的反面”。反脆弱性还没有进入我们的自觉意识；幸运的是，它早已存在于祖先的行为、生物机制，以及所有存活至今的系统之中，是一种普遍属性。\n\n**图 1：一个主动索要压力与混乱的包裹。** 图中包裹贴着“ANTIFRAGILE（反脆弱）”和“PLEASE MISHANDLE（请粗暴搬运）”。图片：Giotto Enterprise 与 George Nasr。\n\n要体会这个概念对我们有多陌生，不妨在下次聚会、野餐，或者暴动前的人群集结中做个实验：问问周围的人，“脆弱”的反义词是什么。一定要反复强调，你问的是严格意义上的反面——特征相反，面对冲击时得到的结果也相反。除了“坚固”，你多半还会听到“不会破”“结实”“做工牢靠”“有韧性”“强壮”，或者“防某某”，比如防水、防风、防锈——除非对方已经听说过这本书。\n\n这些回答都不对。混淆这件事的不只是个人，许多知识领域也一样；在我查过的同义词和反义词词典里，这个错误无处不在。\n\n还可以换个角度来看：正数的反面是负数，而不是零。同理，正的脆弱性，其反面应该是负的脆弱性——所以我称它为“反脆弱性”——而不是代表坚固、强韧和不易破损的中性状态。写成数学形式，反脆弱性就是在脆弱性前面加上一个负号。[注 1]\n\n这个认知盲点似乎普遍存在。我们所知的主要语言，无论现代还是古代，无论正式语言、口语还是俚语，都没有一个词专门表示“反脆弱性”。甚至俄语（苏联版本）和标准布鲁克林英语似乎也没有这个称呼，而是把它与坚固性混在一起。[注 2]\n\n生活有一半——而且是更有意思的那一半——我们还没有名字来称呼。\n\n### 请砍下我的头\n\n如果日常语言里没有反脆弱性的名称，我们仍能在神话中找到对应形象。历史积累的智慧，常常通过强有力的隐喻表达出来。\n\n在一个由希腊神话改编而来的罗马版本中，西西里暴君狄俄尼修斯二世让善于逢迎的廷臣达摩克利斯享用奢华宴席，却在他头顶悬了一把剑，只用一根马尾毛系在天花板上。马尾毛这种东西受压久了终究会断，紧接着便是鲜血、尖叫，以及相当于古代救护车的场面。达摩克利斯是脆弱的：剑落下来要他的命，只是时间问题。\n\n另一则古老传说，是希腊人对古代闪米特和埃及传说的再加工。传说中有一只羽色绚丽的鸟，名叫凤凰。每次遭到毁灭，它都会从自己的灰烬中重生，回到原来的状态。凤凰也是贝鲁特的古老象征，而我正是在那里长大的。传说贝鲁特——历史上称为 Berytus——在近五千年的历史中毁灭过七次，又重建过七次。\n\n这个故事听起来颇有道理，因为第八次毁灭和重建，我亲眼见过。童年后期，残酷的内战第八次彻底摧毁了贝鲁特市中心，也就是古城所在的区域；随后，我又亲眼看见它第八次重建。\n\n不过，最新重建的贝鲁特比此前的模样更好。这里还有一个意味深长的巧合：公元 551 年的地震曾将罗马法学院埋入地下，这次重建时它又被发掘出来，仿佛历史额外赠送的礼物——其间，考古学家与房地产开发商还隔空公开互骂。这样的贝鲁特已经不只是凤凰，而是超越坚固性的另一种事物。这就把我们带到第三个神话隐喻：九头蛇。\n\n希腊神话里的九头蛇是一种蛇形怪物，住在阿尔戈斯附近的勒拿湖，长着许多头。每砍掉一颗头，就会长出两颗。伤害正合它的心意。九头蛇代表的就是反脆弱性。\n\n达摩克利斯之剑则代表权力与成功的副作用：一个人不可能既向上攀升、掌握权力，又不面对持续不断的危险——总会有人积极设法把他拉下来。这种危险也像悬剑一样，沉默、无情而且不连续。它会在长时间的平静之后突然落下，很可能就在你已经习惯它，甚至忘记它存在的时候。\n\n如今你拥有了更多可以失去的东西，黑天鹅就会在那里等着你。这是成功和成长的代价，也可能是过度成功无法逃避的惩罚。到头来，真正要紧的是那根绳子有多结实，而不是宴席上的人有多少财富和权力。幸运的是，只要愿意听，这种弱点可以识别、衡量，也能够处理。“三元组”整套框架的要点就在于：许多情况下，我们能够衡量那根绳子的强度。\n\n还要想想，先增长、再坠落的过程会给社会带来多大的毒害。达摩克利斯之剑落下，宴席上的宾客倒下，同时还会造成我们今天所谓的“附带损害”，殃及其他人。大型机构一旦崩溃，对整个社会就会产生这种影响。\n\n复杂精巧——至少某一种复杂精巧——也会造成面对黑天鹅时的脆弱性。社会变得越来越复杂，塞入越来越多所谓的“尖端”设计，分工也越来越细，于是崩溃的可能性随之上升。考古学家约瑟夫·泰恩特曾以精彩而令人信服的方式勾勒出这个观点。\n\n但事情并非注定如此。只有那些不愿再多走一步、不愿理解现实结构的人，才会落入这种处境。为了抵消成功带来的脆弱性，你需要用很高剂量的坚固性来对冲，甚至需要很高剂量的反脆弱性。你要成为凤凰，最好成为九头蛇；否则，达摩克利斯之剑迟早会落到你头上。\n\n### 命名为什么必要\n\n我们知道的远比自己以为的多，也远比自己能够说清楚的多。即使正式的思想体系贬低自然，即使我们没有一个词来称呼反脆弱性，甚至每当动脑思考时还会抵触这个概念，也不代表我们的行动完全忽视它。\n\n行为所体现的知觉与直觉，可能胜过我们能够明确知道、制成表格、用语言讨论或在课堂上传授的东西。后面我们还会充分讨论这个问题，尤其会借助“否定式表达”这个有力概念，也就是那些用现有词汇无法明确说出或直接描述的东西。眼下先看看下面这个有趣现象。\n\n语言学家盖伊·多伊彻在《透过语言看世界》中提到，许多原始族群并非色盲，却只有两三个颜色名称。不过，一旦接受简单测试，他们能够把不同颜色的绳子准确配对。他们看得出彩虹中各种色调的差异，只是词汇里没有相应名称。这些人在生理上不色盲，却在文化上“色盲”。\n\n同样，我们对反脆弱性的盲区存在于思想层面，而不是有机体本身。想看清区别，只要想一想：讲述一个故事时，你需要“蓝色”这个名称；真正动手选择颜色时，却不需要先说出它的名字。\n\n我们今天习以为常的许多颜色，曾经长期没有名称，在西方文化的核心文献中也找不到名字，这件事并不广为人知。古代地中海地区的希腊和闪米特文献，只有少量颜色词，主要围绕明暗两端。荷马及其同时代人的主要颜色大约只有三四种：黑、白，以及彩虹中某一片界限含混、常被归入红色或黄色的区域。\n\n我联系了盖伊·多伊彻。他非常慷慨地提供帮助，还告诉我，古人甚至连“蓝色”这样基础的词都没有。古希腊语缺少“蓝色”一词，也就解释了荷马为什么一再把海称作“酒暗色之海”（*oinopa ponton*）。这句话让许多读者困惑，我也是其中之一。\n\n有意思的是，最早发现这一现象的是英国首相威廉·格莱斯顿，时间在十九世纪五十年代。他还因此遭到那些惯常轻率行事的记者们不公正的嘲讽。格莱斯顿学识渊博，在两段政治任期之间写了一部研究荷马的巨著，足足一千七百页。在最后一节，他指出古人的颜色词汇很有限，并认为现代人之所以能感知更多细微色差，是因为眼睛经过一代又一代的训练。无论当时文化中的颜色词怎样变化，人们确实能够识别细微色差——除非生理上就是色盲。\n\n格莱斯顿在许多方面都令人钦佩。他学识渊博、意志坚定、尊重弱者、精力旺盛，这四种品质都很有魅力——在本作者看来，尊重弱者仅次于思想上的勇气，是一个人第二迷人的品质。他还显示出非凡的先见之明：他判断《伊利亚特》对应一个真实故事。在特洛伊城尚未被发现的年代，几乎没有人敢这样主张。\n\n此外，他还有一项更具先见之明、也与本书格外相关的坚持：财政预算应当保持平衡。后来的事实表明，财政赤字是社会和经济系统脆弱性的主要来源之一。\n\n### 反脆弱性的雏形\n\n在反脆弱性这个总概念出现以前，已经有两个较初步的概念获得了名称，也有两种先驱性的应用覆盖了其中一些特殊情形。它们只是反脆弱性的温和形式，而且局限在医学领域，但很适合作为起点。\n\n传说，小亚细亚本都王国的米特里达梯四世在父亲遇刺后四处躲藏。为了防止自己被毒死，他开始摄入不致命的小剂量毒物，再逐渐增加剂量。后来，他还把这个过程纳入一套复杂的宗教仪式。\n\n但这种免疫力后来给他惹了麻烦。他想服毒自尽，却因为自己“已经抵御了别人可能使用的毒药”而未能成功，只好请一位盟军将领用剑结束他的生命。\n\n这种方法后来被称为 *Antidotum Mithridatium*，古代名医塞尔苏斯对它大加赞颂。它在罗马想必相当流行，因为大约一个世纪后，它还给尼禄皇帝弑母的计划制造了麻烦。\n\n尼禄一心想杀死母亲阿格里皮娜。为了让故事更热闹一点，她是卡利古拉的妹妹；再热闹一点，据说她还是哲学家塞内加的情人，后面还会讲到塞内加。不过，母亲往往很了解自己的儿子，尤其当他还是独生子时，更容易预判他的行动。阿格里皮娜也懂得一些毒药知识，因为她可能至少毒死过自己的一任丈夫——我说过，这个故事很热闹。\n\n她怀疑尼禄已经买凶杀她，于是提前采用米特里达梯式的方法，使自己对儿子手下能够弄到的毒物产生抵抗力。结果她和米特里达梯一样，最终死于更机械的手段：据说尼禄派刺客杀了她。这留给我们一个虽小却有意义的教训：没有人能对一切都保持坚固。两千年过去了，我们仍没找到一种能让人“练成”刀剑不伤的方法。\n\n我们可以这样定义“米特里达梯化”：持续接触小剂量的某种物质，随着时间推移，对后来更大剂量的同类物质产生免疫。这类思路用于疫苗接种和过敏医学。它还不完全是反脆弱性，只停留在比较温和的坚固层次，不过方向已经接近。我们也得到一个提示：完全不接触毒物，或许反而会使人变脆弱；变得更坚固的道路，可能从少量伤害开始。\n\n现在再看一种情况：有毒物质在某个剂量下，不仅使你免疫，还让你的总体状态变得更好——比坚固性再向前一步。药理学家创造了“毒物兴奋效应”（hormesis）一词，指少量有害物质反而能给生物体带来益处，起到药物般的作用。一点原本有害的物质，只要不太多，就会触发某种过度反应，使生物体整体改善。\n\n当时的人不太把它理解为“从伤害中获益”，更多把它理解成“伤害取决于剂量”或者“药效取决于剂量”。科学家关心的是剂量与反应之间的非线性关系。\n\n古人很熟悉毒物兴奋现象，只是像“蓝色”一样，知道它却没有说出名字。直到 1888 年，德国毒理学家雨果·舒尔茨才首次对它作出“科学的”描述，尽管仍没有命名。他发现，小剂量毒物会刺激酵母生长，大剂量则会造成伤害。\n\n一些研究者认为，蔬菜的益处未必主要来自所谓“维生素”，也未必来自其他那些用于把故事讲圆的理论——这类理论听起来合乎情理，却没有经过严格实证检验。他们提出了另一种解释：植物用有毒物质保护自己、抵御捕食者；人以适当分量摄入这些物质后，它们也许会刺激人体——这个说法目前仍只是一个解释框架。要点仍然是：有限的小剂量毒物可能触发有益反应。\n\n许多人声称，长期或间歇性限制热量摄入，会激活有益健康的反应和生理开关，其中一个效果是在实验动物身上延长预期寿命。人活得太久，研究人员很难验证这种限制是否真的延长人类寿命；如果假说成立，受试者甚至可能比研究人员活得更久。\n\n不过，热量限制看起来会让人更健康，也可能让人更有幽默感。既然食物过剩会产生相反效果，间歇性限制热量也可以这样解释：持续吃得太多有害健康，而让人永远感受不到饥饿这种压力源，可能会使人的生命潜力无法充分发挥。这样看来，毒物兴奋效应只是把食物与饥饿恢复到自然剂量。换句话说，毒物兴奋才是常态，缺少它反而会伤害我们。\n\n二十世纪三十年代以后，毒物兴奋效应失去了一部分科学声誉，相关研究和实践也减少了，因为有人错误地把它与顺势疗法联系起来。这种联系并不公平，两者的机制截然不同。\n\n顺势疗法基于另一套原则，例如认为把致病因子高度稀释到极其微小的程度——小到几乎无法检测，也不可能触发毒物兴奋效应——便能帮助治愈同一种疾病。支持顺势疗法的经验证据很少，加上它所采用的检验方法，它如今属于替代医学；毒物兴奋效应作为一种现象，却有大量科学证据支持。\n\n更大的要点是：我们现在可以看到，剥夺系统所需的压力源，并不必然是好事，甚至可能直接造成伤害。\n\n### 跨领域能力也受领域限制\n\n有些人能在一个领域理解“系统可能需要一定压力与扰动”，换到另一个领域却完全看不见它。由此我们也能看出思维的“领域依赖”。这里的“领域”，指某一类活动或某一个范畴。\n\n一个人也许能在医学领域理解某个观念，却无法在社会经济生活中认出同一个观念；也许能在课堂上听懂，到了纹理复杂得多的街头现实里便不会运用。不知为什么，人一旦离开最初学习某个观念的语境，往往就认不出相同的情形。\n\n我在迪拜这个“伪城市”的一家酒店门前，亲眼见过一个生动例子。一位看起来像银行家的人，让穿制服的行李员替他搬行李。只需极少线索，我便能立即判断某人是不是那一类银行家，因为我对他们有生理性的过敏，甚至会影响呼吸。\n\n大约十五分钟后，我又在健身房看见那个银行家举自由重量。他用壶铃努力模仿自然动作，活像在挥动一只行李箱。领域依赖无处不在。\n\n问题不只是米特里达梯化和毒物兴奋效应在某些医学圈子里广为人知，换到社会经济生活等领域却被忽视。即使在医学内部，人们也可能在一个地方懂得它，在另一个地方又忘掉它。同一位医生可能刚建议你运动，好让身体“更强健”，几分钟后又因为一次微不足道的感染给你开抗生素，只为让你“别生病”。\n\n再看领域依赖的另一种表现。你去问一位美国公民：是否应该成立一个具有很大独立性、不受国会干预的半政府机构，专门控制汽车、晨报和马尔贝克葡萄酒的价格？他大概会气得跳起来，认为这违背美国立国的每一项原则，甚至会骂你是苏联解体后潜伏下来的共产主义鼹鼠。\n\n好吧。接着问他，同一个政府机构是否应该控制外汇价格，尤其是美元兑欧元和蒙古图格里克的汇率？他的反应还是一样：这里又不是法国。\n\n然后轻轻提醒他，美国联邦储备系统所做的工作，正是控制和管理另一种商品的价格：借贷的价格，也就是整个经济体中的利率——而且它已经证明自己很擅长这样做。自由意志主义总统候选人罗恩·保罗曾主张废除美联储，或者至少限制其职能，因此被视作怪人。但如果他主张新设一个机构去控制其他商品的价格，同样也会被视作怪人。\n\n想象一个人很有语言天赋，却无法把概念从一种语言转移到另一种语言。每学一门新语言，他都得重新学习一次“椅子”“爱”和“苹果派”。他不会认出英语的 *house*、西班牙语的 *casa* 与闪米特语的 *byt* 表达的是同一个概念。\n\n从某种意义上说，我们人人都有类似障碍：同一个观念换一种语境出现，我们便认不出它。我们仿佛注定会受骗于事物最表面的部分——包装盒和礼品纸。因此，即使反脆弱性出现在非常明显、甚至明显得过了头的地方，我们仍然看不见。\n\n主流观念并不习惯把成功、经济增长或创新理解为系统对压力源的过度补偿，我们在其他地方也看不出这种过度补偿正在发生。（领域依赖还解释了另一件事：许多研究者很难意识到，不确定性、不完全理解、混乱和波动其实属于同一个关系密切的家族。）\n\n这种无法“翻译”概念的能力缺失，是生而为人的一种认知障碍。只有有意识地克服并穿透它，我们才会开始接近智慧或理性。\n\n现在，让我们进一步讨论过度补偿。\n\n### 脚注\n\n1. 正如凹性是在凸性前加上负号，因此有时也被称作“反凸性”。\n2. 除了布鲁克林英语，我还检查了多数印欧语言：既包括古代语言拉丁语、希腊语，也包括现代的罗曼语族（意大利语、法语、西班牙语、葡萄牙语）、斯拉夫语族（俄语、波兰语、塞尔维亚语、克罗地亚语）、日耳曼语族（德语、荷兰语、南非语）和印度-伊朗语族（印地语、乌尔都语、波斯语）。非印欧语系中同样没有这个词，包括闪米特语族（阿拉伯语、希伯来语、阿拉米语）和突厥语族（土耳其语）。\n\n---\n\n## 关键句直译对照\n\n### 1. 易碎事物真正的反面\n\n英文短句：*The fragile is the package that would be at best unharmed ... And the opposite of fragile is therefore what is at worst unharmed.*\n\n- 贴近原句：易碎包裹充其量不受损；坚固包裹无论最好还是最坏都不受损。因此，易碎的反面，是最坏也不受损的东西。\n- 本文顺译：易碎事物最好的结果只是无损；坚固事物始终只是无损；反脆弱事物以“最坏也无损”为下限，还有从波动中获益的上行空间。\n- 译法提醒：最后一句单独看像是在定义“坚固”。它必须接着上一句的“最好与最坏”一起读，作者真正强调的是结果分布不对称。\n\n### 2. 凤凰与九头蛇\n\n英文短句：*It always returns to its initial state.* / *Each time one is cut off, two grow back.*\n\n- 直译：凤凰总会回到初始状态；九头蛇每被砍掉一个头，就长出两个。\n- 区别：凤凰象征恢复，九头蛇象征因伤害而增益。两者都没有被摧毁，但只有后者超越了原状。\n\n### 3. 我们知道的多于能说出的\n\n英文短句：*We know more than we think we do, a lot more than we can articulate.*\n\n- 直译：我们知道的比自己以为的更多，也比自己能够清楚表达的多得多。\n- 本文顺译：行动中的知觉和直觉，可能已经掌握了某种规律，而正式语言与理论尚未给它命名。\n- 边界：能做却说不清，不自动证明做法正确；作者这里只是在区分实践能力与明确知识。\n\n### 4. 领域依赖\n\n英文短句：*Humans somehow fail to recognize situations outside the contexts in which they usually learn about them.*\n\n- 直译：人类似乎无法在自己通常学习某个观念的语境之外，认出同类情形。\n- 本文顺译：我们常把概念和它最初出现的包装绑在一起，换个行业或场景便失去迁移能力。\n\n---\n\n## 章后伴读\n\n### 这一章做了什么\n\n这一章主要完成三件事：\n\n1. 用达摩克利斯、凤凰和九头蛇建立“脆弱—坚固—反脆弱”的三分法。\n2. 用米特里达梯化与毒物兴奋效应说明：坚固与反脆弱之间存在差异，而且“少量有害、大量有害”之间可能是非线性的。\n3. 提出“领域依赖”：人能在一个领域理解某种结构，却无法把它迁移到另一个领域。\n\n### 作者的论证走到哪里\n\n- **定义与模型**：三种神话形象很适合帮我们记住概念差别，但神话本身不是经验证据。\n- **特殊实例**：免疫和毒物兴奋效应说明某些生物系统会对特定剂量的压力产生适应或改善。它们支持“存在这种现象”，还不能支持“压力通常都有益”。\n- **迁移主张**：作者随后把这个结构推广到城市、机构、财政与货币政策。这里主要依靠类比和例子，更系统的证明要留到后文检验。\n\n### 阅读时要守住的边界\n\n“反脆弱”不是“越折腾越好”。至少要同时回答四个问题：\n\n- 受益的是同一个对象，还是整体通过牺牲部分成员获益？\n- 有益的是哪一类冲击，剂量、频率和持续时间是多少？\n- 所谓“变好”用什么指标衡量？短期改善是否换来长期风险？\n- 下行损失是否有上限？如果一次冲击足以毁灭系统，它便没有机会从中学习。\n\n### 本章值得保留的一句话\n\n恢复原状叫韧性；因适量波动获得改善，才是反脆弱。判断时必须连同对象、尺度、剂量和代价一起说清楚。\n\n### 给你的一个问题\n\n你现在更想把“凤凰”和“九头蛇”的区别放到哪个具体场景里检验：个人学习、工作方式、企业经营，还是投资决策？\n"},{"id":"反脆弱/ch01/002_中文语境易读版.md","book":"反脆弱","chapterId":"ch01","chapterNumber":1,"chapterTitle":"第 1 章","title":"第 1 章　中文语境易读版","variant":"中文语境易读版","preferred":true,"content":"# 第 1 章　中文语境易读版\n\n- 英文原文：PDF 物理页 47–59，单元 `ch01`，offset `0–21057`\n- 忠实核对版：[001 · 伴读与译文](001_伴读与译文.md)\n- 本版目标：保留作者的观点和案例，用更自然、直白的中文重讲一遍\n- 标签规则：`原文观点` 和 `作者原例` 来自本章；`伴读辅助｜我补充` 是为了帮助理解而添加的例子\n- 阅读状态：易读版已生成，尚未确认用户读完\n\n> 建议先读这一版。觉得某句话被我改写得太多，或想知道作者究竟用了什么例子时，再打开忠实核对版。以下医疗、饮食与政策内容都是作者在本章提出的论述，不构成针对个人的建议。\n\n## 读这一章，先记住一件事\n\n我们平常把“不容易坏”当成“脆弱”的反义词，塔勒布认为这还差了一步。\n\n- 一碰就坏，叫**脆弱**。\n- 碰了以后没事，叫**稳健**或**有韧性**。\n- 碰了以后反而比原来更强，才叫**反脆弱**。\n\n本章后面的所有故事，其实都在反复解释这三个层次。\n\n---\n\n## 一、我们一直缺了一个词\n\n### 【原文观点】“不坏”还不是“越碰越强”\n\n假设你要寄一箱香槟杯。为了防止运输途中摔坏，你会在箱子上贴“易碎品”或“小心轻放”。\n\n现在问一个看似简单的问题：“易碎”的反义词是什么？\n\n大多数人会说：结实、牢固、有韧性、不容易坏。但塔勒布说，这些词表达的只是“受到碰撞也不会变差”。它们并没有表达另一种可能：有些东西受到适当的碰撞后，反而会变得更好。\n\n真正与“易碎品”完全相反的包裹，外面不该只写“不怕摔”，而应该写：“请使劲折腾我。”因为里面的东西不但不会坏，还能从折腾中得到好处。\n\n这就是塔勒布想用“反脆弱”命名的现象。\n\n### 【作者原例】主动要求粗暴搬运的包裹\n\n书里的插图是一只纸箱，上面贴着两个标签：一个是“反脆弱”，另一个是“请粗暴搬运”。作者还建议你去聚会或野餐时问问别人“脆弱的反义词是什么”。人们多半会回答防水、防风、坚固、强韧，却很少想到“受到冲击后反而获益”。\n\n作者借数学语言又解释了一遍：如果脆弱代表受到波动后的损失，那么它的反面不该是零损失，而应该是受到波动后的正收益。“零损失”只是中间状态，也就是稳健。\n\n他查了许多古代和现代语言，发现人们往往只有“脆弱”和“坚固”这一组词，没有一个常用词能准确表达“从波动中获益”。所以他说，生活中最有意思的那一半，我们一直没有给它起名字。\n\n### 【伴读辅助｜我补充】用学习来理解三者\n\n三个人做了一次很难的模拟考试：\n\n- 第一个人错题一多就彻底失去信心，以后看见同类题都害怕。他在这次冲击中变差了，这是**脆弱**。\n- 第二个人情绪稳定，第二天照常学习，水平既没下降也没提高。他扛住了冲击，这是**稳健**。\n- 第三个人把错题分类，发现自己总在审题上出错，于是改掉了做题流程。下次遇到难题时，他比考试前更强了，这是**反脆弱**。\n\n这里的重点不是“考试越难越好”，而是第三个人有一套把错误转化成改进的机制。没有这套机制，冲击只是伤害。\n\n### 【边界提醒】\n\n“反脆弱”必须说明对象和结果。模拟考试失败可能让学习方法变好，但不代表身体健康、经济状况或所有其他方面也会变好。\n\n---\n\n## 二、达摩克利斯、凤凰和九头蛇\n\n作者用三个神话形象，把前面的概念变得更具体。\n\n### 【作者原例 1】达摩克利斯：表面风光，实际脆弱\n\n西西里暴君狄俄尼修斯二世让善于奉承的廷臣达摩克利斯坐在豪华宴席上，却在他头顶悬了一把剑。整把剑只由一根马尾毛吊着。\n\n宴席多豪华并不重要，达摩克利斯多有权势也不重要。真正决定结局的，是那根马尾毛能撑多久。一旦它断掉，长期的平静会在一瞬间变成灾难。\n\n这就是脆弱：平时看起来一切正常，甚至非常成功，但整个系统依赖一个经不起考验的薄弱点。风险可能很久都不出现，一出现就是突然垮掉。\n\n作者进一步说，当大机构采用越来越复杂的结构、越来越精细的分工时，可能会积累这种脆弱性。机构一旦倒下，损失还会扩散给无辜的人。成功让它拥有更多，也让它有更多东西可以失去。\n\n### 【伴读辅助｜我补充】只有一个供应商的公司\n\n一家公司的销量连续翻倍，看起来非常成功，但核心零件只向一家供应商采购。多年里从未出过问题，管理层便认为这套模式很高效。\n\n某天供应商停产，公司立即无法交货。这里的“马尾毛”就是唯一供应商。过去的增长没有消除风险，反而让更多订单和客户一起暴露在这个薄弱点上。\n\n这个例子帮助我们理解作者说的“成功的代价”：规模变大之后，如果承重结构没有一起变强，成功本身也可能放大脆弱性。\n\n### 【作者原例 2】凤凰：坏了还能恢复\n\n凤凰每次毁灭后，都会从灰烬中重生，恢复成原来的样子。它不会被灾难永久消灭，但灾难也没有让它变得更强。\n\n塔勒布在贝鲁特长大。传说这座城市在近五千年里被毁七次，又重建七次。他自己还亲历了内战造成的第八次毁灭与重建。\n\n最新重建的贝鲁特比过去更好，施工中还发现了公元 551 年地震掩埋的罗马法学院遗址。作者认为，这已经超出了“凤凰式恢复”：城市没有简单回到原样，而是在重建中得到了新的东西。\n\n### 【作者原例 3】九头蛇：伤害反而让它增加\n\n希腊神话中的九头蛇住在勒拿湖。砍掉一颗头，它会长出两颗。凤凰只是复原，九头蛇却会因为受到攻击而变得更强。\n\n因此，作者用达摩克利斯代表脆弱，用凤凰代表稳健或恢复力，用九头蛇代表反脆弱。\n\n### 【伴读辅助｜我补充】同一次项目失败，三种团队\n\n- 达摩克利斯式团队把所有关键知识都放在一个人脑子里。这个人离职，项目就停摆。\n- 凤凰式团队有文档和备份。有人离职后，项目能恢复到原来的进度。\n- 九头蛇式团队每次出现人员变动，都会补文档、拆分权限、训练替补。经历几次小问题后，团队比原先更不依赖某个个人。\n\n第三种团队并不是喜欢人员离职，而是能够利用小规模问题暴露结构缺陷，并在大问题发生前修复它。\n\n### 【边界提醒】\n\n九头蛇只是帮助记忆的神话，不是证明。现实中的人和组织都有承受上限。一次足以致命的冲击不会带来成长，只会让系统失去继续调整的机会。\n\n---\n\n## 三、你可能会做，却不一定说得清\n\n### 【原文观点】能力可能先于命名\n\n塔勒布说，我们实际知道的东西，往往比我们能说清楚的多。\n\n人可能在行动中已经会利用某种规律，却没有词汇和理论来解释它。没有“反脆弱”这个词，不代表人类过去从未做过反脆弱的事；只是在没有名字时，我们很难把同一个结构从一个领域搬到另一个领域。\n\n### 【作者原例】看得见颜色，却说不出颜色的名字\n\n语言学家盖伊·多伊彻研究过一些只有两三个基本颜色词的族群。这些人并不是生理上的色盲。让他们把颜色相同的绳子放在一起，他们能够准确完成；只是他们的语言没有那么多颜色名称。\n\n古希腊语甚至没有今天意义上的“蓝色”一词。荷马因此把海写成“酒暗色之海”。英国政治家格莱斯顿在十九世纪五十年代注意到这个现象。他研究荷马时提出，古人的颜色词很少，但这不代表他们的眼睛看不出色差。\n\n作者借这个故事说明：做出区分是一种能力，为这种区分命名又是另一种能力。没有名字时，我们仍可能“看见”；有了名字以后，我们才更容易讨论、归纳和迁移。\n\n作者顺带称赞了格莱斯顿的学识、意志、对弱者的尊重和精力，也赞赏他相信《伊利亚特》有真实历史背景，并坚持财政预算平衡。最后这点被作者用来连接全书主题：他认为财政赤字会增加社会和经济系统的脆弱性。\n\n### 【伴读辅助｜我补充】经验丰富的人常有这种感觉\n\n一个做了多年招聘的面试官，可能在十分钟内感觉到某位候选人“不太对劲”，却暂时讲不清原因。事后复盘，他才发现自己注意到了几处细节：回答总是回避具体责任、成果无法说明衡量方法、前后叙述不一致。\n\n在复盘以前，他已经能够做出某种判断；把细节说出来以后，这种经验才可能教给别人，也更容易接受检验和纠正。\n\n### 【边界提醒】\n\n“我说不清，但我感觉对”并不能保证判断正确。作者在这里强调的是隐性经验可能存在，并没有证明直觉永远可靠。命名的价值，恰恰还包括让直觉可以被讨论和质疑。\n\n---\n\n## 四、小剂量伤害，可能触发有益反应\n\n这一节最容易被误读。作者不是在说“受伤总是好事”，而是在区分两个层次：\n\n- 接触小剂量刺激后，以后不容易被同类刺激伤害，这是从脆弱走向**稳健**。\n- 接触小剂量刺激后，整体状态反而比以前更好，这是从稳健走向**反脆弱**。\n\n### 【作者原例 1】米特里达梯：练出抗毒能力\n\n传说本都国王米特里达梯四世担心被人下毒，便长期服用不致命的小剂量毒物，并逐渐加量。后来他想服毒自尽，却发现自己已经产生抗毒能力，只能请盟军将领用剑结束自己的生命。\n\n类似的故事也发生在尼禄的母亲阿格里皮娜身上。她猜到儿子可能用毒药杀她，于是提前让自己对常见毒物产生抵抗。她最后还是死于刺客之手。\n\n作者用这两个故事说明：对一种伤害有抵抗力，不等于对所有伤害都有抵抗力。抗毒能力挡不住刀剑。\n\n塔勒布把逐渐接触小剂量物质、从而对更大剂量产生免疫的过程称为“米特里达梯化”。他把疫苗和过敏医学列为类似思路。这种变化主要是让人不再容易受损，所以更接近稳健，还不是完整的反脆弱。\n\n### 【作者原例 2】毒物兴奋效应：不只免疫，状态还变好\n\n药理学中的“毒物兴奋效应”指的是：某种物质在大剂量下有害，在足够小的剂量下却可能触发生物体的有益反应。这里关键的不是“毒物有益”，而是效果随剂量变化，并不是一条直线。\n\n德国毒理学家雨果·舒尔茨在 1888 年观察到，小剂量毒物会刺激酵母生长，大剂量则会伤害酵母。作者还提到一种研究假说：蔬菜中的某些植物毒素，在适当摄入量下可能刺激人体的防御反应。原文自己也用“故事是这样讲的”来保留不确定性。\n\n作者接着讨论热量限制。他说，长期或间歇性限制热量可能激活某些有益反应，并在实验动物中延长寿命；由于人类寿命很长，研究者很难直接完成同样的寿命验证。他由此提出一种解释：持续吃得过多、完全没有饥饿感，可能偏离了人的自然生活节奏。\n\n二十世纪三十年代以后，毒物兴奋效应一度被错误地和顺势疗法混在一起。作者强调，两者机制不同。顺势疗法使用极度稀释的致病因子，浓度低到难以触发毒物兴奋反应，其经验证据也很少；毒物兴奋效应作为剂量反应现象，则有较多证据支持。\n\n### 【伴读辅助｜我补充】把产品先给十个人试用\n\n一个团队准备发布新产品。脆弱的做法是关起门来做一年，然后一次性推给十万用户。一个严重问题就可能造成巨大损失。\n\n更能利用波动的做法，是先让十个真实用户试用。小规模抱怨会暴露按钮难找、说明不清、流程容易中断等问题。团队修正这些问题后，产品比试用前更成熟。\n\n这里的小范围试用就像“可控剂量的压力”。用户的不满没有被浪漫化，它之所以有价值，是因为：损失规模有限、反馈能够被识别、团队有能力根据反馈调整。\n\n### 【边界提醒】\n\n剂量决定性质。能引发适应的小刺激，放大以后可能直接造成不可逆伤害。书中的医学例子应该理解为作者对非线性反应的说明，不能自行转化成服毒、停药、节食或拒绝治疗的行动。\n\n---\n\n## 五、同一个道理，换个场景就认不出来\n\n### 【原文观点】我们常常只会在熟悉的领域里思考\n\n一个人可能懂得“身体需要适度压力”，却看不出组织也可能需要小规模试错；可能在课堂上听懂一个概念，回到现实生活就不会使用。\n\n塔勒布把这种现象叫作“领域依赖”：我们记住的往往不只是道理，还包括它第一次出现时的包装。包装一换，我们就像第一次见到它。\n\n### 【作者原例 1】让人搬行李，再去健身房举重\n\n塔勒布在迪拜一家酒店门前，看见一位银行家让行李员替自己搬箱子。十五分钟后，他又看见这个人在健身房举壶铃，努力模仿提行李一样的自然动作。\n\n这个人知道负重训练对身体有好处，却没有把这个道理用到刚才那只真实的行李箱上。相同的动作，放进“服务场景”和“健身场景”，在他脑中就变成了两件事。\n\n### 【作者原例 2】医生一面让你锻炼，一面消灭所有小刺激\n\n同一位医生可能先让人锻炼，好让身体变强；几分钟后，又为一次轻微感染开抗生素，只求不让身体经历任何不适。作者用这个例子批评人们在医学内部也无法稳定地运用同一种逻辑。\n\n这只是作者用来说明矛盾的例子。具体感染是否需要抗生素，必须依据病情和专业判断，不能仅凭“压力可能有益”得出结论。\n\n### 【作者原例 3】反对控制商品价格，却接受控制利率\n\n假如你问一位美国人，是否应该让一个不受国会干预的半政府机构决定汽车、报纸和葡萄酒的价格，他多半会认为这是不可接受的价格管制。\n\n再问他是否该由类似机构控制汇率，他可能仍然反对。然后作者提醒：美联储实际上就在管理另一种价格——借钱的价格，也就是利率。罗恩·保罗因为主张废除或限制美联储而被视作怪人；可如果他主张成立一个机构管制其他商品价格，人们同样会觉得他古怪。\n\n作者关心的不是在这一小段里完整论证美联储该不该存在，而是指出：人们会因为对象名称不同，对结构相近的事情作出完全不同的判断。\n\n### 【作者原例 4】每学一种语言，就重新学习一次“椅子”\n\n想象一个很有语言天赋的人，却无法把概念从一种语言转移到另一种语言。他学会英语的 *house*，再遇到西班牙语的 *casa* 时，竟然无法认出二者都表示“房子”；每学一门语言，还要把“椅子”“爱”和“苹果派”重新理解一遍。\n\n作者说，我们在不同领域之间也常处于这种状态。同一个结构换了行业、换了术语、换了包装，我们就认不出来。这也是为什么反脆弱性明明到处存在，却长期没有进入主流的成功、增长和创新叙事。\n\n### 【伴读辅助｜我补充】复盘别人容易，复盘自己很难\n\n一个管理者看到别的团队项目失败，会立刻说：“应该小步试验，早点暴露问题。”轮到自己的项目时，他却要求方案一次成型，不允许团队发布测试版，因为他把试验中的错误看作能力不足。\n\n他懂“小步试错”，但只会把这个原则用在别人身上。要克服领域依赖，需要主动问一句：我现在遇到的事情，和我在其他地方已经理解的哪种结构相同？\n\n---\n\n## 全章用大白话重讲\n\n塔勒布这一章的意思可以压缩成下面几句话：\n\n有些东西经不起变化，一变就坏；有些东西能扛住变化，但不会因此进步；还有一些东西，能把适量的变化、错误和压力转化成改进机会。第三类东西就是反脆弱。\n\n真正关键的不是“经历过苦难”，而是有没有一套机制把小规模冲击变成反馈，同时把最坏损失控制在可承受范围内。没有反馈机制、调整能力和损失上限，苦难就只是苦难。\n\n人类还有一个常见问题：在一个领域懂得这个道理，换个场景便认不出来。因此，读后面的章节时，不要只问“作者又讲了什么故事”，还要问：“这些故事背后的结构是不是同一个？换到我的场景里，哪些部分仍然成立，哪些已经不同？”\n\n## 这一章暂时不要急着相信什么\n\n本章很好地建立了一个观察框架，但还没有证明所有复杂系统都需要压力，也没有证明各种医疗、财政或组织问题都能用同一套办法解决。后续阅读时，需要继续检查四件事：\n\n1. 谁从冲击中获益，谁承担代价？\n2. 多大的冲击算“适量”，越过什么点会造成毁灭？\n3. 变好是短期表现，还是长期能力真的提高？\n4. 作者给的是定义、故事、类比，还是可验证的证据？\n\n## 给你的一个问题\n\n回想你最近学会的一项能力：哪一次小错误或小失败，真的改变了你的方法，使你下一次做得更好？关键可能不在那次失败，而在你当时做了怎样的反馈和调整。\n"}];

const storage={get(key,fallback){try{const value=localStorage.getItem(key);return value===null?fallback:value}catch{return fallback}},set(key,value){try{localStorage.setItem(key,value)}catch{}}};

function esc(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function inline(text){return esc(text).replace(/\[([^\]]+)\]\([^)]+\)/g,'<span class="inline-link">$1</span>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>')}
function kindFor(text){if(text.includes('伴读辅助｜我补充'))return'helper';if(text.includes('作者原例'))return'author-example';if(text.includes('原文观点'))return'author-point';if(text.includes('边界提醒'))return'boundary';return'normal'}
function markdown(source){const lines=source.split(/\r?\n/);const blocks=[];let i=0,kind='normal';while(i<lines.length){const line=lines[i].trim();if(!line){i++;continue}const heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){kind=heading[1].length===3?kindFor(heading[2]):'normal';blocks.push({type:'heading',level:heading[1].length,text:heading[2],kind});i++;continue}if(/^---+$/.test(line)){kind='normal';blocks.push({type:'rule',kind});i++;continue}if(line.startsWith('>')){const parts=[];while(i<lines.length&&lines[i].trim().startsWith('>'))parts.push(lines[i++].trim().replace(/^>\s?/,''));blocks.push({type:'quote',text:parts.join(' '),kind});continue}if(/^[-*]\s+/.test(line)||/^\d+\.\s+/.test(line)){const ordered=/^\d+\.\s+/.test(line),pattern=ordered?/^\d+\.\s+/:/^[-*]\s+/,items=[];while(i<lines.length&&pattern.test(lines[i].trim()))items.push(lines[i++].trim().replace(pattern,''));blocks.push({type:ordered?'ordered':'list',items,kind});continue}const parts=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,6})\s+|^---+$|^>\s?|^[-*]\s+|^\d+\.\s+/.test(lines[i].trim()))parts.push(lines[i++].trim());blocks.push({type:'paragraph',text:parts.join(' '),kind})}return blocks.map((block,index)=>{const attr=' data-kind="'+block.kind+'"';if(block.type==='heading'){const level=Math.min(block.level||2,4);return'<h'+level+' id="section-'+index+'"'+attr+'>'+inline(block.text)+'</h'+level+'>'}if(block.type==='rule')return'<hr>';if(block.type==='quote')return'<blockquote'+attr+'>'+inline(block.text)+'</blockquote>';if(block.type==='list'||block.type==='ordered'){const tag=block.type==='ordered'?'ol':'ul';return'<'+tag+attr+'>'+block.items.map(item=>'<li>'+inline(item)+'</li>').join('')+'</'+tag+'>'}return'<p'+attr+'>'+inline(block.text)+'</p>'}).join('')}
function current(){return library.find(item=>item.id===state.documentId)||preferred}

function syncPanels(){document.querySelector('.library-panel').classList.toggle('is-open',state.sidebarOpen);document.querySelector('.reading-stage').classList.toggle('with-sidebar',state.sidebarOpen);document.querySelector('.scrim').classList.toggle('is-open',state.sidebarOpen);document.querySelector('.settings-panel').hidden=!state.settingsOpen;document.getElementById('menu-button').textContent=state.sidebarOpen?'‹':'☰';document.getElementById('settings-button').setAttribute('aria-expanded',String(state.settingsOpen))}
function render(restorePosition=true){const doc=current();if(!doc){app.innerHTML='<main class="empty-library">还没有可阅读的译文。</main>';return}const allChapters=chapters(),chapterIndex=allChapters.findIndex(item=>chapterKey(item)===chapterKey(doc)),versions=library.filter(item=>chapterKey(item)===chapterKey(doc)),toc=(doc.content.match(/^##\s+.+$/gm)||[]).map(line=>line.replace(/^##\s+/,''));app.innerHTML='<div class="reader-shell" data-theme="'+esc(state.theme)+'"><header class="reader-bar"><div class="bar-left"><button id="menu-button" class="icon-button" aria-label="打开章节目录">☰</button><span class="brand-mark" aria-hidden="true">▤</span><div><strong>静读</strong><span>'+esc(doc.book)+'</span></div></div><div class="bar-title"><span>'+esc(doc.chapterTitle)+'</span><strong>'+esc(doc.title.replace(/^第\s*\d+\s*章[　\s]*/,''))+'</strong></div><div class="bar-actions"><button id="theme-button" class="icon-button" aria-label="切换日夜主题">◐</button><button id="settings-button" class="icon-button" aria-label="阅读设置" aria-expanded="false">Aa</button></div><div id="reading-progress" class="reading-progress" role="progressbar" aria-label="本页阅读进度" aria-valuemin="0" aria-valuemax="100"></div></header><aside class="library-panel" aria-label="书籍目录"><div class="panel-heading"><div><span class="eyebrow">书架</span><h2>'+esc(doc.book)+'</h2></div><button data-close-sidebar class="icon-button mobile-close" aria-label="关闭目录">×</button></div><nav class="chapter-list">'+allChapters.map((item,index)=>'<button data-chapter="'+index+'" class="'+(chapterKey(item)===chapterKey(doc)?'active':'')+'"><span>'+String(item.chapterNumber).padStart(2,'0')+'</span><div><strong>'+esc(item.chapterTitle)+'</strong><small>'+library.filter(candidate=>chapterKey(candidate)===chapterKey(item)).length+' 个版本</small></div></button>').join('')+'</nav><div class="toc"><span class="eyebrow">本章目录</span>'+toc.map((title,index)=>'<button data-toc="'+index+'">'+esc(title)+'</button>').join('')+'</div></aside><button class="scrim" data-close-sidebar aria-label="关闭目录"></button><aside class="settings-panel" aria-label="阅读设置" hidden><div class="settings-title"><div><span class="eyebrow">阅读设置</span><h2>调到眼睛舒服为止</h2></div><button data-close-settings class="icon-button" aria-label="关闭阅读设置">×</button></div><label class="setting-control"><span>字号 <b id="font-value">'+state.fontSize+'px</b></span><input data-setting="fontSize" type="range" min="16" max="30" step="1" value="'+state.fontSize+'"></label><label class="setting-control"><span>行距 <b id="line-value">'+state.lineHeight.toFixed(2)+'</b></span><input data-setting="lineHeight" type="range" min="1.5" max="2.4" step="0.05" value="'+state.lineHeight+'"></label><label class="setting-control"><span>正文宽度 <b id="measure-value">'+state.measure+'px</b></span><input data-setting="measure" type="range" min="560" max="940" step="20" value="'+state.measure+'"></label><fieldset><legend>页面主题</legend><div class="theme-options"><button data-theme-choice="paper"><i data-swatch="paper"></i>明亮</button><button data-theme-choice="green"><i data-swatch="green"></i>护眼</button><button data-theme-choice="night"><i data-swatch="night"></i>夜间</button></div></fieldset><p class="settings-note">设置和阅读位置只保存在这台电脑的 Chrome 里。</p></aside><main class="reading-stage"><article class="reader-page"><fieldset class="document-switcher"><legend hidden>选择译文版本</legend>'+versions.map((item,index)=>'<button data-version="'+index+'" class="'+(item.id===doc.id?'active':'')+'">'+(item.preferred?'易读版':'忠实版')+'<small>'+esc(item.variant)+'</small></button>').join('')+'</fieldset><div class="reader-content">'+markdown(doc.content)+'</div><footer class="chapter-footer"><button class="outline-button" data-prev '+(chapterIndex<=0?'disabled':'')+'>‹ 上一章</button><span>读到这里会自动记住位置</span><button class="outline-button" data-next '+(chapterIndex<0||chapterIndex>=allChapters.length-1?'disabled':'')+'>下一章 ›</button></footer></article></main></div>';syncStyle();syncPanels();if(restorePosition)requestAnimationFrame(()=>scrollTo({top:Number(storage.get('reader-position:'+doc.id,0)),behavior:'instant'}));updateProgress()}
function chooseChapter(index){const item=chapters()[index];if(!item)return;const options=library.filter(candidate=>chapterKey(candidate)===chapterKey(item));state.documentId=(options.find(candidate=>candidate.preferred)||options[0]).id;state.sidebarOpen=false;persist();render()}
function updateProgress(){const available=document.documentElement.scrollHeight-innerHeight;const value=available>0?Math.min(100,scrollY/available*100):0;const bar=document.getElementById('reading-progress');if(bar){bar.style.width=value+'%';bar.setAttribute('aria-valuenow',String(Math.round(value)))}const doc=current();if(doc)storage.set('reader-position:'+doc.id,String(scrollY))}
app.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.id==='menu-button'){state.sidebarOpen=!state.sidebarOpen;syncPanels();return}if(target.id==='settings-button'){state.settingsOpen=!state.settingsOpen;syncPanels();return}if(target.id==='theme-button'){state.theme=state.theme==='night'?'green':'night';syncStyle();return}if(target.matches('[data-close-sidebar]')){state.sidebarOpen=false;syncPanels();return}if(target.matches('[data-close-settings]')){state.settingsOpen=false;syncPanels();return}if(target.dataset.themeChoice){state.theme=target.dataset.themeChoice;syncStyle();return}if(target.dataset.chapter!==undefined){chooseChapter(Number(target.dataset.chapter));return}if(target.dataset.version!==undefined){const doc=current(),versions=library.filter(item=>chapterKey(item)===chapterKey(doc));state.documentId=versions[Number(target.dataset.version)].id;persist();render();return}if(target.dataset.toc!==undefined){document.querySelectorAll('.reader-content h2')[Number(target.dataset.toc)]?.scrollIntoView({behavior:'smooth'});if(innerWidth<=900){state.sidebarOpen=false;syncPanels()}return}const list=chapters(),index=list.findIndex(item=>chapterKey(item)===chapterKey(current()));if(target.matches('[data-prev]')&&index>0)chooseChapter(index-1);if(target.matches('[data-next]')&&index<list.length-1)chooseChapter(index+1)});
app.addEventListener('input',event=>{const name=event.target.dataset.setting;if(!name)return;state[name]=Number(event.target.value);syncStyle()});
addEventListener('scroll',updateProgress,{passive:true});
render();
</script></body></html>
